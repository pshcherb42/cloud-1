[defaults]
# No default inventory on purpose: Makefile picks one with the -i flag
# User created by cloud-init / default on Ubuntu images
remote_user = ubuntu
# Project key: every person creates its own ~/.ssh/cloud1,
# so this path works everywhere; each public key must be allowed on the servers
private_key_file = ~/.ssh/cloud1
# System Python on Ubuntu 22.04 (3.10); explicit so Ansible doesn't guess and warn
interpreter_python = /usr/bin/python3

[ssh_connection]
# Ansible's default args (compression + connection reuse), plus accept-new:
# trust hosts never seen before, but still refuse a known IP whose host key changed.
# scripts/vms.sh clears stale known_hosts entries when it launches a new VM.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
