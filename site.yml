---
- name: Prepare servers
  hosts: cloud1
  become: true # run as root
  # we don't tell "install this" we say whatever you do,
  # when you finish "this" should be installed
  tasks:
    - name: Curl is installed # task names describe the result
      ansible.builtin.apt:
        name: curl
        state: present
        update_cache: true
        cache_valid_time: 3600 # 1h
    - name: SSH is running and enabled at boot
      ansible.builtin.service:
        name: ssh
        state: started
        enabled: true
