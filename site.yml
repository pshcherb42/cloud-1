---
- name: Deploy cloud-1 stack
  hosts: cloud1
  become: true # run as root
  roles:
    - common
    - docker
    - firewall
    - app
    - duckdns
    # - tls
  # tasks moved to roles/{role}/tasks/main.yml
  post_tasks:
    - name: Show site URLs
      ansible.builtin.debug:
        msg:
          - "WordPress: http://{{ domain }}/"
          - "phpMyAdmin: http://{{ domain }}{{ pma_path }}"
