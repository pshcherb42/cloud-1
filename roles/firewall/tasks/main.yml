---
- name: UFW is installed
  ansible.builtin.apt:
    name: ufw # firewall package
    state: present

- name: Required ports opened
  community.general.ufw:
    rule: allow
    port: "{{ item }}" # for item in loop... kind of
    proto: tcp
  loop:
    - "22"
    - "80"
    - "443"

- name: UFW is enabled and denies connections by default # ports not on the allowed list get "deny" as default.
  community.general.ufw:
    state: enabled
    policy: deny

- name: PasswordAuthentication is disabled # we log in with keys so leaving password login is risky
  ansible.builtin.copy:
    content: "PasswordAuthentication no\n"
    dest: /etc/ssh/sshd_config.d/10-no-password.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh
